# CI do Lokuras no Espaço:
#   - build-linux: build no Linux + smoke test com drivers dummy (o jogo roda
#     5 segundos sem display real e o timeout precisa MATAR o processo, exit
#     124 - se o jogo travar ou sair antes, o smoke falha) + pacote .tar.gz;
#   - build-windows: build com MinGW i686 (MSYS2) + o mesmo smoke test com
#     drivers dummy + pacote .zip com o game.exe, as DLLs e os assets;
#   - build-macos: compila o SDL 1.2 local (Homebrew + setup-sdl12-macos),
#     gera o .app autocontido e roda o mesmo smoke test com drivers dummy;
#   - build-web: build WebAssembly com o Emscripten + smoke test em um
#     navegador headless (tools/smoke-web.mjs), que confere se o jogo desenha
#     quadros, se o teclado responde e se o /save (IndexedDB) montou;
#   - deploy-web: em push para master, publica o MESMO bin/web testado no
#     GitHub Pages (https://victorgmbraga.github.io/lokuras-no-espaco/).
#     O Pages precisa estar habilitado em Settings -> Pages -> Source:
#     "GitHub Actions" (o GITHUB_TOKEN nao consegue habilitar sozinho).

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SDL 1.2 (dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl1.2-dev \
            libsdl-image1.2-dev \
            libsdl-ttf2.0-dev \
            libsdl-mixer1.2-dev \
            libsdl-gfx1.2-dev

      - name: Build
        run: ./build.sh

      - name: Smoke test (drivers dummy, 5 s)
        run: |
          # O bash do Actions roda com -e: sem o "|| status=$?" o proprio
          # timeout (124) derrubaria o step antes da checagem.
          status=0
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 5 ./bin/game || status=$?
          # 124 = o timeout matou o jogo no ar: comportamento esperado.
          if [ "$status" -ne 124 ]; then
            echo "O jogo saiu/crashou antes do timeout (exit $status)."
            exit 1
          fi

      # Pacote pronto para rodar: binario + assets (o jogo carrega img/, sfx/,
      # map/ e ttf/ por caminhos relativos) + um LEIA-ME com os requisitos.
      # O tar.gz preserva o bit de execucao (o zip de artefato nao preserva).
      - name: Empacotar (Linux x86_64)
        run: |
          mkdir -p dist/lokuras-linux
          cp bin/game dist/lokuras-linux/
          cp -r img sfx map ttf dist/lokuras-linux/
          cp LICENSE CREDITS.md dist/lokuras-linux/
          cp -r lib/LICENSES dist/lokuras-linux/licencas
          cat > dist/lokuras-linux/LEIA-ME.txt <<'EOF'
          Lokuras no Espaco - Linux x86_64
          =================================

          Execute nesta pasta:
            ./jogar.sh    (ou ./game)

          Requisitos: runtime do SDL 1.2 (SDL, SDL_image, SDL_ttf, SDL_mixer
          e SDL_gfx). Em distros modernas, o sdl12-compat fornece a API 1.2.
          Os assets (img/, sfx/, ttf/) precisam ficar ao lado do jogo.
          Cada partida gera um mapa aleatorio (limite de 16x16 tiles).
          Pontuacao com combo, torretas, chefe em ondas com fases, combustivel
          e conquistas. No menu, 1/2/3 escolhem a dificuldade.
          Para repetir o mesmo mapa: ./game --seed N (ou --daily).
          EOF
          cat > dist/lokuras-linux/jogar.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          exec ./game "$@"
          EOF
          chmod +x dist/lokuras-linux/jogar.sh dist/lokuras-linux/game
          tar -C dist/lokuras-linux -czf dist/lokuras-linux-x86_64.tar.gz .

      - name: Publicar artefato (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: lokuras-linux-x86_64
          path: dist/lokuras-linux-x86_64.tar.gz
          if-no-files-found: error

  # O macOS nao traz o SDL 1.2 e o Homebrew nao empacota mais o SDL_image,
  # SDL_ttf e SDL_mixer da API 1.2. O setup-sdl12-macos.sh compila as cinco
  # bibliotecas dentro do projeto; o build-macos.sh --app gera um bundle
  # autocontido (dylibs em Contents/Frameworks, assinatura ad-hoc).
  build-macos:
    name: macOS (app bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencias (Homebrew)
        run: |
          brew install \
            sdl2-compat libpng jpeg-turbo freetype libogg libvorbis \
            pkg-config cmake dylibbundler

      - name: SDL 1.2 local (compila as cinco bibliotecas)
        run: ./tools/setup-sdl12-macos.sh

      - name: Build + app bundle
        run: ./build-macos.sh --app

      - name: Smoke test (drivers dummy, 5 s)
        run: |
          app="$PWD/dist/Lokuras no Espaço.app"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$app/Contents/MacOS/Lokuras" >/dev/null 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            echo "O jogo saiu/crashou antes do timeout (exit $status)."
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "OK: o jogo continuou rodando por 5 s."

      - name: Empacotar (macOS)
        run: |
          tar -czf dist/lokuras-macos.tar.gz -C dist "Lokuras no Espaço.app"

      - name: Publicar artefato (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: lokuras-macos
          path: dist/lokuras-macos.tar.gz
          if-no-files-found: error

  # O jogo usa as import libs i686 da SDL versionadas em lib/, entao o
  # compilador precisa ser o MinGW i686. O MSYS2 instala o toolchain pronto
  # (mesma ABI msvcrt), sem o download interativo do tools/setup-mingw.ps1.
  build-windows:
    name: Windows (MinGW i686)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: MinGW i686 (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Versão do MinGW
        shell: cmd
        env:
          MINGW: ${{ steps.msys2.outputs['msys2-location'] }}\mingw32\bin
        run: |
          set "PATH=%MINGW%;%PATH%"
          "%MINGW%\g++.exe" --version
          "%MINGW%\g++.exe" -dumpmachine

      - name: Build
        shell: cmd
        env:
          MINGW: ${{ steps.msys2.outputs['msys2-location'] }}\mingw32\bin
          NO_PAUSE: "1"
        run: |
          rem O cc1plus.exe fica em lib/gcc/... e precisa achar as DLLs do
          rem MinGW pelo PATH (nao basta chamar o g++.exe pelo caminho).
          set "PATH=%MINGW%;%PATH%"
          build.bat

      - name: Smoke test (drivers dummy, 5 s)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process -FilePath '.\bin\game.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Error "O jogo saiu/crashou antes do timeout (codigo $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: o jogo continuou rodando por 5 s."

      - name: Empacotar (Windows x86)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\lokuras-windows | Out-Null
          Copy-Item bin\game.exe dist\lokuras-windows\
          Copy-Item bin\*.dll dist\lokuras-windows\
          Copy-Item img,sfx,map,ttf dist\lokuras-windows\ -Recurse
          Copy-Item LICENSE,CREDITS.md dist\lokuras-windows\
          Copy-Item lib\LICENSES dist\lokuras-windows\licencas -Recurse

          $leiame = @(
            'Lokuras no Espaco - Windows x86',
            '',
            'Extraia esta pasta e execute game.exe (ou jogar.bat).',
            'As DLLs e os assets (img\, sfx\, ttf\) precisam ficar juntos.',
            'Cada partida gera um mapa aleatorio (limite de 16x16 tiles).',
            'Pontuacao com combo, torretas, chefe em ondas, combustivel e conquistas.',
            '',
            'Controles: ENTER comeca; 1/2/3 no menu escolhem a dificuldade;',
            'W/S acelera/freia; A/D gira; ESPACO/MOUSE1 atira;',
            'ESC pausa; M muda o som.',
            'Mesmo mapa de novo: game.exe --seed N (ou --daily para o dia atual).'
          )
          Set-Content -Path dist\lokuras-windows\LEIA-ME.txt -Value $leiame -Encoding utf8

          $jogar = @(
            '@echo off',
            'cd /d "%~dp0"',
            'start "" game.exe'
          )
          Set-Content -Path dist\lokuras-windows\jogar.bat -Value $jogar -Encoding ascii

          # tar.exe (bsdtar) cria o zip sem depender do modulo
          # Microsoft.PowerShell.Archive, que pode faltar no runner.
          tar.exe -a -c -f dist\lokuras-windows-x86.zip -C dist\lokuras-windows .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar artefato (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: lokuras-windows-x86
          path: dist/lokuras-windows-x86.zip
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Mesma versao usada no desenvolvimento (tools/setup-emsdk.*).
      - name: Emscripten (emsdk 6.0.12)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.12

      - name: Build web (WebAssembly + ports da SDL 2)
        run: ./build-web.sh

      - name: Smoke test no navegador (headless, Chrome do runner)
        run: |
          python3 -m http.server 8000 --directory bin/web &
          sleep 1
          SMOKE_SCREENSHOT=bin/web-smoke.png node tools/smoke-web.mjs

      - name: Artefato do smoke (screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke
          path: bin/web-smoke*.png
          if-no-files-found: ignore

      # O site e estatico e usa so caminhos relativos, entao o mesmo bin/web
      # funciona tanto em http://localhost:8000/ quanto na subpasta do Pages
      # (/lokuras-no-espaco/). So publica o que passou no smoke test acima.
      - name: Empacotar o site (GitHub Pages)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bin/web

  deploy-web:
    name: Publicar no GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Um deploy por vez; se chegar outro push durante a publicacao, espera em
    # vez de cancelar (o site nunca fica pela metade).
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
